name: Deploy static guides

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      public_site_url: ${{ steps.config.outputs.public_site_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and verification tools
        run: python -m pip install -e '.[dev]'
      - name: Verify tests and code style
        run: |
          python -m pytest
          ruff check src tests
          ruff format --check src tests
      - name: Validate publishing configuration
        id: config
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          python - <<'PY'
          import ipaddress
          import os
          import re
          from urllib.parse import urlsplit

          from us_new_entities.geo.redirect import validate_public_site_url

          project = 'us-new-entities'
          origin = validate_public_site_url(
              os.environ.get('PUBLIC_SITE_URL') or f'https://{project}.pages.dev'
          )
          parsed = urlsplit(origin)
          hostname = parsed.hostname
          if parsed.port not in (None, 443):
              raise SystemExit('PUBLIC_SITE_URL must use the default HTTPS port.')
          try:
              ipaddress.ip_address(hostname)
          except ValueError:
              pass
          else:
              raise SystemExit('PUBLIC_SITE_URL must use the deployed Pages hostname or a custom domain.')
          labels = hostname.split('.')
          if len(labels) < 2 or any(
              not re.fullmatch(r'[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?', label)
              for label in labels
          ):
              raise SystemExit('PUBLIC_SITE_URL must contain a valid public DNS hostname.')
          reserved = ('localhost', 'local', 'test', 'invalid', 'example', 'example.com', 'example.net', 'example.org')
          if any(hostname == suffix or hostname.endswith('.' + suffix) for suffix in reserved):
              raise SystemExit('Replace the example PUBLIC_SITE_URL with the deployed Pages origin.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'public_site_url={origin}\n')
          PY
      - name: Generate flat LLC and corporation guides
        env:
          PUBLIC_SITE_URL: ${{ steps.config.outputs.public_site_url }}
          NORTHWEST_AFFILIATE_URL: ${{ vars.NORTHWEST_AFFILIATE_URL || 'https://www.northwestregisteredagent.com/registered-agent' }}
          HARBOR_AFFILIATE_URL: ${{ vars.HARBOR_AFFILIATE_URL || 'https://www.harborcompliance.com/registered-agent' }}
        run: |
          python -m us_new_entities.geo.generator dist \
            --layout flat --extensionless-urls --entity-type LLC --entity-type C-Corp
      - name: Verify static assets, schemas, and extensionless routes
        env:
          PUBLIC_SITE_URL: ${{ steps.config.outputs.public_site_url }}
        run: python -m us_new_entities.geo.verify dist --base-url "$PUBLIC_SITE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: static-guides
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static-site health checker
        run: python -m pip install --no-deps .
      - uses: actions/download-artifact@v4
        with:
          name: static-guides
          path: dist/
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets before deploying.'
            exit 1
          fi
      - name: Deploy dist to us-new-entities (main)
        uses: cloudflare/wrangler-action@v3
        env:
          WRANGLER_LOG: debug
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          # Equivalent CLI: npx wrangler pages deploy dist --project-name=us-new-entities --branch=main --commit-dirty=true
          command: pages deploy dist --project-name=us-new-entities --branch=main --commit-dirty=true
      - name: Verify published assets and response headers
        continue-on-error: true
        env:
          PUBLIC_SITE_URL: ${{ needs.build.outputs.public_site_url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if python -m us_new_entities.geo.verify dist --base-url "$PUBLIC_SITE_URL" --check-live; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 5
            fi
          done
          exit 1
