[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-new-entities"
version = "0.1.0"
description = "Typed US entity compliance screening and state qualification rules"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools]
packages = ["us_new_entities", "us_new_entities.models", "us_new_entities.rules", "us_new_entities.rules.states", "us_new_entities.scrapers", "us_new_entities.geo"]
package-dir = {us_new_entities = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
